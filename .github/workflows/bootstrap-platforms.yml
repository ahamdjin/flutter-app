name: Bootstrap Flutter Platforms

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check native projects
        id: check
        run: |
          if [ -d android ] && [ -d ios ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.needed == 'true'
        with:
          channel: stable
          cache: true

      - name: Generate Android and iOS projects
        if: steps.check.outputs.needed == 'true'
        run: |
          flutter create             --platforms=android,ios             --project-name=flutter_app             --org=com.orbitproductivity             .

      - name: Commit generated native projects
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata pubspec.lock
          git commit -m "Add generated Android and iOS platform projects"
          git push
